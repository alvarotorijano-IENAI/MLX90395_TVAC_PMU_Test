; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ATmega128_AtmelICE

[serial_port]
serial_baud = 115200
monitor_port = COM3
monitor_speed = ${serial_port.serial_baud}

[ATmega128_8MHZ_noBootloader_64pin]
platform = atmelavr
board = ATmega128
framework = arduino
board_build.f_cpu = 8000000L
board_build.variant = 64-pin-avr
build_flags = -c -g -Os -std=gnu++17
	-fpermissive
	-fno-exceptions
	-ffunction-sections
	-fdata-sections
	-fno-threadsafe-statics
	-DF_CPU=8000000L
	-DSERIAL_BAUD=${serial_port.serial_baud}

[ATmega128_7.3MHZ_noBootloader_64pin]
platform = atmelavr
board = ATmega128
framework = arduino
board_build.f_cpu = 7372800L
board_build.variant = 64-pin-avr
build_flags = -c -g -Os -std=gnu++17
	-fpermissive
	-fno-exceptions
	-ffunction-sections
	-fdata-sections
	-fno-threadsafe-statics
	-DF_CPU=7372800L
	-DSERIAL_BAUD=${serial_port.serial_baud}

[AtmelICE]
upload_protocol = custom
upload_port = usb
upload_flags = 
	-C
	${platformio.packages_dir}/tool-avrdude/avrdude.conf
	-p
	$BOARD_MCU
	-P
	$UPLOAD_PORT
	-c
	atmelice_jtag
upload_command = avrdude $UPLOAD_FLAGS -U flash:w:$SOURCE:i

[USB-ASP]
upload_protocol = custom
upload_command = "${platformio.packages_dir}/tool-avrdude/avrdude" -C"${platformio.packages_dir}/tool-avrdude/avrdude.conf" -v -V -patmega128 -cusbasp -Uflash:w:$SOURCE:i

[dumpelf]
extra_scripts = scripts/dump_elf.py

[env:ATmega128_USBASP]
extends = ATmega128_8MHZ_noBootloader_64pin, USB-ASP, serial_port
lib_deps = 
	adafruit/Adafruit BusIO@^1.17.4
	adafruit/Adafruit Unified Sensor@^1.1.15

[env:ATmega128_AtmelICE]
extends = ATmega128_7.3MHZ_noBootloader_64pin, AtmelICE, serial_port
lib_deps = 
	adafruit/Adafruit BusIO@^1.17.4
	adafruit/Adafruit Unified Sensor@^1.1.15

[env:ATmega128_AtmelICE_8MHz]
extends = ATmega128_8MHZ_noBootloader_64pin, AtmelICE, serial_port
extra_scripts = post:scripts/log_serial.py
lib_deps = 
	adafruit/Adafruit BusIO@^1.17.4
	adafruit/Adafruit Unified Sensor@^1.1.15
